[project]
name = "square-qbo-sales-receipts"
version = "0"
description = "Record Square deposits as sales receipts in QuickBooks Online"
authors = [
    {name = "Kristaps Berzinch",email = "kristapsberzinch@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "aws-lambda-powertools[tracer] (>=3.34.0,<4.0.0)",
    "squareup (>=45.1.0.20260819,<46.0.0.0)",
    "python-quickbooks (>=0.9.12,<0.10.0)",
]

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "flake8-black (>=0.4.0,<0.5.0)",
    "flake8-bugbear (>=25.11.29,<26.0.0)",
    "flake8-import-order (>=0.19.2,<0.20.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pylint (>=4.0.7,<5.0.0)",
    "boto3 (>=1.43.78,<2.0.0)",
    "boto3-stubs (>=1.43.78,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "handler.py" },
]

[[tool.mypy.overrides]]
module = "intuitlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "quickbooks.*"
ignore_missing_imports = true
