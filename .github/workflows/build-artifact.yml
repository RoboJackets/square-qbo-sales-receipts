---
name: Build Lambda ZIP

on:
  workflow_call:

jobs:
  build-artifact:
    name: Build Lambda ZIP
    runs-on: ubuntu-26.04-arm

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15.0-rc.1'

      - name: Setup Poetry
        uses: abatilo/actions-poetry@v4

      - name: Add export plugin
        run: poetry self add poetry-plugin-export

      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: venv-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry dependencies
        run: poetry install

      - name: Run black
        run: poetry run black --check handler.py

      - name: Run flake8
        run: poetry run flake8 handler.py

      - name: Run pylint
        run: poetry run pylint handler.py

      - name: Run mypy
        run: poetry run mypy --strict --scripts-are-modules handler.py

      - name: Export requirements
        run: poetry export -f requirements.txt --without dev --without-hashes -o requirements.txt

      - name: Build bundle in Lambda 3.15 container
        uses: docker://public.ecr.aws/lambda/python:3.15-preview
        with:
          entrypoint: /bin/bash
          args: .github/scripts/build-lambda-bundle.sh

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          path: _bundle.zip
          if-no-files-found: error
          compression-level: 0
